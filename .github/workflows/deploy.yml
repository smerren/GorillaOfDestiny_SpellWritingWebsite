# Build the site and publish it to GitHub Pages.
#
# Pages serves the built artifact directly, so Jekyll never runs over it and a
# .nojekyll file is not needed. Asset paths are relative (`base: './'` in
# vite.config.ts), so the site works at /<repo>/ without further configuration.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Queued runs are allowed to finish rather than being
# cancelled, so a deploy is never abandoned half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The suite checks every published rune against the chords the Gorilla of
      # Destiny's own dictionary draws, so a broken encoding cannot be deployed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
